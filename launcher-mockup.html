<!doctype html>
<html lang="de" style="--accent: #552ffb;"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Moritz und Zen"><title>LayerNX · Quiet</title><style>*{box-sizing:border-box} :root{--accent:#552ffb;--bg:#0c0d10;--panel:#1a1c22;--muted:#a0a3b1}body{margin:0;background:var(--bg);color:#f8f8fc;font:15px Arial,sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #fff;outline-offset:-4px}svg{width:24px;height:24px;flex-shrink:0}#screen{min-height:100svh;max-width:480px;margin:auto;display:flex;flex-direction:column;padding:0 16px;position:relative;overflow:hidden}.status{height:32px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;flex-shrink:0}.status .right{display:flex;gap:6px;align-items:center}.status svg{height:13px;width:13px}.battery{border:1px solid #a0a3b1;border-radius:3px;padding:1px 3px;font-size:9px}.brand{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted)}.brand b{color:#fff}header{display:flex;justify-content:space-between;align-items:center;margin:11px 0 18px}.gear{width:44px;height:44px;background:var(--panel);border-radius:50%;display:grid;place-items:center}.greeting{font-size:23px;letter-spacing:-.7px;margin:0 0 6px;font-weight:600;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:12px}.time{font-size:68px;letter-spacing:-4px;line-height:1.05;font-weight:500;font-variant-numeric:tabular-nums}.date{font-size:13px;color:var(--muted);margin-top:8px}.app{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--panel);border-radius:18px;min-height:52px}.app.primary{background:var(--accent);color:white}.softkeys{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding:14px 0 10px;font-size:11px;color:var(--muted);gap:8px}.softkeys button{background:transparent;padding:10px 2px;min-height:40px}.softkeys .ok{font-size:10px;border:1px solid #42444f;border-radius:7px;padding:5px 8px;min-height:28px}.content{flex:1}.tiles .clockblock{margin:6px 0 22px}.tiles .time{font-size:60px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiles .grid .app{height:91px;flex-direction:column;gap:9px;font-size:13px}.tiles .grid .app svg{width:27px;height:27px}.tiles .grid .app:not(.primary) svg{color:#bdb4ff}.list header{margin-bottom:22px}.list .greeting{font-size:19px}.list .clockblock{display:flex;align-items:end;justify-content:space-between;margin-bottom:19px}.list .time{font-size:48px;letter-spacing:-2px}.list .date{font-size:11px;text-align:right;line-height:1.5}.list .app{justify-content:flex-start;position:relative;height:57px;border-radius:12px;margin-bottom:7px;padding:0 13px;background:transparent;border:1px solid #292b33}.list .app.primary{background:var(--accent);border-color:var(--accent)}.list .app span{flex:1}.list .app:after{content:'›';color:var(--muted);font-size:22px}.list .app small{font-size:11px;color:var(--muted)}.zen{background:radial-gradient(ellipse at 90% 35%,#552ffb26,transparent 65%),#0c0d10}.zen .clockblock{text-align:center;margin:30px 0 37px}.zen .time{font-size:83px;letter-spacing:-5px;font-weight:300}.zen .greeting{font-size:18px;text-align:center}.zen .date{margin-top:13px}.zen .line{width:28px;height:3px;background:var(--accent);margin:22px auto 0;border-radius:2px}.zen .dock{display:flex;gap:10px;margin:22px 0 14px}.zen .dock .app{flex:1;height:75px;flex-direction:column;gap:8px;font-size:11px;border-radius:22px}.zen .all{width:100%;background:transparent;border:1px solid #32323f;justify-content:space-between;padding:0 16px}.dashboard header{margin-bottom:13px}.dashboard .greeting{font-size:21px}.dashboard .hero{display:flex;align-items:center;justify-content:space-between;background:var(--accent);padding:18px 15px;border-radius:20px;margin:17px 0 11px}.dashboard .hero .time{font-size:48px;letter-spacing:-2px}.dashboard .hero .date{color:#e4deff;font-size:11px}.hero svg{width:34px;height:34px}.dashboard .grid .app{height:67px;font-size:12px;gap:7px;border-radius:15px}.dashboard .music{margin-top:11px;padding:13px;background:var(--panel);border:1px solid #2d303a;border-radius:16px;display:flex;align-items:center;gap:11px;width:100%;text-align:left;min-height:66px}.music .album{display:grid;place-items:center;background:#34303f;border-radius:9px;width:36px;height:36px;color:#c8bdff}.music .track{flex:1;font-size:12px}.music small{display:block;color:var(--muted);margin-top:5px;font-size:10px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--muted);margin:15px 0 9px}.quick{display:flex;gap:9px}.quick button{flex:1;min-height:44px;border-radius:12px;background:var(--panel);font-size:11px}.quick button.on{box-shadow:inset 0 0 0 1px var(--accent);color:#d4ccff}.shade{position:absolute;inset:32px 0 0;background:#0c0d10f5;padding:22px 16px;z-index:5;overflow:auto}.shade[hidden]{display:none}.shade h2{font-size:22px;margin:10px 0 24px}.shade label{display:block;margin:20px 0 8px;color:var(--muted);font-size:13px}.shade input{width:100%;min-height:44px;background:#242630;color:white;border:1px solid #414451;border-radius:10px;padding:8px}.shade input[type=color]{padding:4px}.shade .close{margin-top:24px;width:100%;background:var(--accent);min-height:48px;border-radius:13px}.shade p{color:var(--muted);line-height:1.6}.shade .app{margin-bottom:8px;width:100%}.toast{position:absolute;bottom:67px;left:16px;right:16px;background:#eee;color:#111;padding:13px;border-radius:13px;font-size:12px;text-align:center;z-index:8}.toast[hidden]{display:none}@media(max-height:520px){.zen .clockblock{margin:10px 0 15px}.tiles .grid .app{height:72px}header{margin-bottom:10px}.tiles .clockblock{margin-bottom:12px}}</style></head><body><main id="screen" class="zen"><div class="status"><span>LayerNX</span><span class="right">4G ▴▴▴ <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0"></path><circle cx="12" cy="20" r=".7"></circle></svg> <span class="battery">82</span></span></div><div class="content"><header><div class="brand">Layer<b>NX</b></div><button class="gear" aria-label="Anpassen" data-settings=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"></path></svg></button></header><div class="clockblock"><div class="time">14:32</div><div class="date">Montag, 9. November</div><div class="line"></div></div><h1 class="greeting">Hallo, <span class="username">Moritz</span>.</h1><div class="dock"><button class="app primary" data-app="Telefon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a14 14 0 0 1-7-7l2-2Z"></path></svg><span>Telefon</span></button><button class="app " data-app="Nachrichten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 19 0Z"></path><path d="M7 9h9M7 13h6"></path></svg><span>Nachrichten</span></button><button class="app " data-app="Kamera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="15" rx="3"></rect><path d="m7 6 2-3h6l2 3"></path><circle cx="12" cy="13" r="4"></circle></svg><span>Kamera</span></button></div><button class="app all" data-app="Alle Apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"></rect><rect x="15" y="3" width="6" height="6" rx="1"></rect><rect x="3" y="15" width="6" height="6" rx="1"></rect><rect x="15" y="15" width="6" height="6" rx="1"></rect></svg><span>Alle Apps</span></button></div><nav class="softkeys"><button data-app="Telefon">Telefon</button><button class="ok" data-app="Alle Apps">●</button><button data-app="Alle Apps">Apps</button></nav><section class="shade" id="settings" hidden=""><div class="brand">DEIN LAUNCHER</div><h2>Mach’s zu deinem.</h2><label for="name">Dein Name</label><input id="name" maxlength="18"><label for="color">Akzentfarbe</label><input id="color" type="color"><button class="close" data-close="">Fertig</button></section><section class="shade" id="apps" hidden=""><h2>Deine Apps</h2><button class="app " data-app="Telefon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a14 14 0 0 1-7-7l2-2Z"></path></svg><span>Telefon</span></button><button class="app " data-app="Nachrichten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 19 0Z"></path><path d="M7 9h9M7 13h6"></path></svg><span>Nachrichten</span></button><button class="app " data-app="Kamera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="15" rx="3"></rect><path d="m7 6 2-3h6l2 3"></path><circle cx="12" cy="13" r="4"></circle></svg><span>Kamera</span></button><button class="app " data-app="Musik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2"></path><ellipse cx="6" cy="18" rx="3" ry="3"></ellipse><ellipse cx="17" cy="16" rx="3" ry="3"></ellipse></svg><span>Musik</span></button><button class="app " data-app="Kontakte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 22v-3a8 8 0 0 1 16 0v3"></path></svg><span>Kontakte</span></button><button class="close" data-close="">Zurück</button></section><div class="toast" role="status" hidden="">Telefon · Designvorschau</div></main><script>const CONFIG={"name":"Moritz","color":"#552ffb"};
function apply(){document.documentElement.style.setProperty('--accent',CONFIG.color);document.querySelectorAll('.username').forEach(e=>e.textContent=CONFIG.name);document.querySelector('#name').value=CONFIG.name;document.querySelector('#color').value=CONFIG.color;}
apply();let timer;
function toast(t){const e=document.querySelector('.toast');e.textContent=t;e.hidden=false;clearTimeout(timer);timer=setTimeout(()=>e.hidden=true,2200)}
function closePanels(){document.querySelectorAll('.shade').forEach(e=>e.hidden=true)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-settings')){closePanels();document.querySelector('#settings').hidden=false;}if(b.hasAttribute('data-close'))closePanels();if(b.dataset.app){if(b.dataset.app==='Alle Apps'){document.querySelector('#apps').hidden=false;}else toast(b.dataset.app+' · Designvorschau');}if(b.hasAttribute('data-toggle')){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.classList.toggle('on',on);toast(b.textContent+(on?' an':' aus')+' · Demo');}});
document.querySelector('#name').addEventListener('input',e=>{CONFIG.name=e.target.value||'Moritz';apply()});document.querySelector('#color').addEventListener('input',e=>{CONFIG.color=e.target.value;apply()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanels();return;}if(!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)||e.target.matches('input'))return;const panel=[...document.querySelectorAll('.shade')].find(x=>!x.hidden)||document.querySelector('#screen');const buttons=[...panel.querySelectorAll('button')].filter(x=>x.offsetParent!==null);let i=buttons.indexOf(document.activeElement);i=(i+(e.key==='ArrowUp'||e.key==='ArrowLeft'?-1:1)+buttons.length)%buttons.length;buttons[i]?.focus();e.preventDefault();});</script></body></html>
